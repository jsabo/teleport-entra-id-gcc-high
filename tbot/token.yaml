kind: token
version: v2
metadata:
  name: terraform
spec:
  roles: [Bot]
  bot_name: terraform
  join_method: bound_keypair
  bound_keypair:
    recovery:
      # relaxed: the bot may rejoin on its own if tbot/storage is lost, for
      # example after the machine is rebuilt. standard: an operator must issue
      # a new registration secret each time.
      mode: relaxed
