# Teleport SAML connector for a Microsoft Entra ID tenant in GCC High.
# Fill in the five placeholders: PROXY_ADDR, TENANT_ID, APP_ID and the two
# group object IDs. The README explains each.
kind: saml
version: v2
metadata:
  name: entra-id
spec:
  display: Microsoft Entra ID

  # The same URL goes into Entra as Identifier (Entity ID) and Reply URL.
  acs: https://PROXY_ADDR/v1/webapi/saml/acs/entra-id
  audience: https://PROXY_ADDR/v1/webapi/saml/acs/entra-id
  service_provider_issuer: https://PROXY_ADDR/v1/webapi/saml/acs/entra-id

  # Entra's signing certificate and sign-in URL come from this document on
  # the GCC High sign-in host.
  entity_descriptor_url: https://login.microsoftonline.us/TENANT_ID/federationmetadata/2007-06/federationmetadata.xml?appid=APP_ID

  # One entry per Entra group, matched by object ID.
  attributes_to_roles:
    - name: http://schemas.microsoft.com/ws/2008/06/identity/claims/groups
      value: GROUP_ADMINS_ID
      roles:
        - editor
    - name: http://schemas.microsoft.com/ws/2008/06/identity/claims/groups
      value: GROUP_DEVELOPERS_ID
      roles:
        - access

  # When a user is in more than 150 groups Entra sends a Microsoft Graph link
  # instead of the groups. Teleport follows it only on the global cloud
  # endpoint, which GCC High does not serve, so following is turned off.
  entra_id_groups_provider:
    disabled: true
